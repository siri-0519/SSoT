# 세션 브랜치에 push 하면 그 브랜치를 main 에 합친다.
#
# AI 에이전트의 세션(클라우드 · 로컬)은 저마다 claude/ 로 시작하는 브랜치에서 일한다.
# 이 워크플로가 없으면 main 이 세션의 일을 받지 못해서, 다음 세션이 main 에서 시작할 때
# 앞 세션의 일이 빠진다. push 할 때마다 main 에 합치므로 누를 것이 없다.
#
# 세션은 push 하기 전에 main 을 먼저 자기 브랜치에 합친다. 그래서 여기서 합칠 때는 충돌이
# 나지 않는다. 그래도 충돌이 나면 합치지 않고 실패로 남긴다. 그 브랜치의 세션이 main 을
# 합쳐 충돌을 풀고 다시 push 하면 그때 합쳐진다.

name: sync-main

on:
  push:
    branches:
      - "claude/**"

permissions:
  contents: write

concurrency:
  # 두 세션이 함께 push 해도 main 에 한 번에 하나씩 합친다.
  group: sync-main
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 세션 브랜치를 main 에 합친다
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git merge-base --is-ancestor "origin/$BRANCH" HEAD; then
            echo "main 에 $BRANCH 가 이미 들어 있다."
            exit 0
          fi

          if ! git merge --ff --no-edit -m "Merge $BRANCH into main" "origin/$BRANCH"; then
            git merge --abort || true
            echo "::error::$BRANCH 가 main 과 충돌한다. 그 세션에서 main 을 합쳐 충돌을 풀고 다시 push 한다."
            exit 1
          fi

          git push origin HEAD:main
